[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-ops-agent"
version = "0.1.0"
description = "A tool-using operations assistant with guarded analytics, policy retrieval, MCP support and human approval."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "openai>=2,<3",
    "sqlglot>=30,<31",
    "alembic>=1.17,<2",
    "langgraph>=1.2.14,<2",
    "langgraph-checkpoint-postgres>=3.1.2,<4",
    "pgvector>=0.4,<1",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2"]
demo = ["streamlit==1.65.0", "requests>=2.32,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
